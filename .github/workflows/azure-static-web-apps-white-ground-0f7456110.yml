name: Azure Static Web Apps CI/CD (meducweb)

# Target SWA: meducweb → white-ground-0f7456110.7.azurestaticapps.net
# Required secret: AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Verify deployment token secret
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110 }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Missing GitHub secret AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110"
            echo "Get token: az staticwebapp secrets list --name meducweb --resource-group meducaht-rg --query properties.apiKey -o tsv"
            echo "Set secret: gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110 --repo drjosuengenyi/meduc-website"
            exit 1
          fi
          echo "Deployment token secret is present (length check only)."
          echo "token_length=${#SWA_TOKEN}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build (Next.js static export)
        run: |
          npm ci
          npm run build
          test -d out
          test -f out/index.html

      - name: Deploy to Azure Static Web Apps
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110 }}
          action: "upload"
          app_location: "out"
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_GROUND_0F7456110 }}
          action: "close"
